name: Safari Live page
# ON THIS BRANCH the file name is borrowed so the job can be dispatched
# before it lands on the default branch: the job is the data-channel check
# (run-dc.py). The camera's address and the relay are dispatch inputs; the
# credentials are repository secrets and never appear in a log.
on:
  workflow_dispatch:
    inputs:
      page:
        description: "camera URL (http://host:port)"
        required: true
        default: ""
      reloads:
        description: "seconds stream mode, space-separated (e.g. '16 1 negotiated')"
        required: false
        default: "16 1 negotiated"
      params:
        description: "TURN url (turn:host:3478?transport=udp), or empty"
        required: false
        default: ""
jobs:
  datachannel:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Safari version
        run: defaults read /Applications/Safari.app/Contents/Info.plist CFBundleShortVersionString || true
      - name: Enable Safari WebDriver
        run: sudo safaridriver --enable
      - name: Selenium
        run: |
          python3 -m venv venv
          ./venv/bin/python -m pip install --upgrade pip
          ./venv/bin/python -m pip install 'selenium>=4.20'
      - name: Drive Safari
        env:
          CAMERA_USER: ${{ secrets.CAMERA_USER }}
          CAMERA_PASS: ${{ secrets.CAMERA_PASS }}
          TURN_USER: ${{ secrets.TURN_USER }}
          TURN_PASS: ${{ secrets.TURN_PASS }}
        run: |
          set -- ${{ github.event.inputs.reloads }}
          ICE=""
          if [ -n "${{ github.event.inputs.params }}" ]; then
            ICE="[{\"urls\":\"${{ github.event.inputs.params }}\",\"username\":\"$TURN_USER\",\"credential\":\"$TURN_PASS\"}]"
          fi
          ./venv/bin/python run-dc.py "${{ github.event.inputs.page }}" "$1" "$2" "$3" "$ICE"
