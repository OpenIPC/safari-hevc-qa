<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Safari zoom A/B</title>
<style>
  html,body{margin:0;background:#111;color:#ddd;font:13px system-ui,sans-serif}
  /* A fixed stage that clips, like the Live page's #mj-stage. */
  #stage{position:relative;width:900px;height:506px;background:#000;overflow:hidden}
  #v{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
  #c{display:none}
  pre{white-space:pre-wrap;word-break:break-word;padding:8px}
</style>
</head>
<body>
<!-- A/B for OpenIPC/majestic-webui#335 residual flicker: does resizing a
     decoding <video> (what preview-zoom.js does on the Live page — Fit/Fill/1:1
     set the element's pixel width/height) make Safari flicker, where the
     Preview component (object-fit:contain, never resized) does not?
     ?mode=resize toggles the size at known times; ?mode=control never does. -->
<div id="stage"><video id="v" muted autoplay playsinline></video></div>
<canvas id="c"></canvas>
<pre id="log">loading…</pre>
<script src="zoom-ab.js"></script>
</body>
</html>
